name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_version:
        description: '构建版本号（如 latest 或 1.0.0）'
        required: false
        default: 'latest'
        type: string
      create_release:
        description: '同时创建 GitHub Release（需要填写版本号）'
        required: false
        default: false
        type: boolean
      push_to_dockerhub:
        description: '是否推送到 Docker Hub（需先配置 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN secrets）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  IMAGE_NAME: smsboard

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secrets
        if: github.event.inputs.push_to_dockerhub == 'true' || github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::推送到 Docker Hub 需要先在仓库 Settings → Secrets → Actions 配置 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Login to Docker Hub
        if: github.event.inputs.push_to_dockerhub == 'true' || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine release version
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.build_version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      # 多架构镜像推送 Docker Hub（仅当配置了 secrets 并要求推送时）
      - name: Build and push multi-arch image (amd64 + arm64)
        if: github.event.inputs.push_to_dockerhub == 'true' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.rel.outputs.version }}

      - name: Inspect multi-arch image
        if: github.event.inputs.push_to_dockerhub == 'true' || github.event_name == 'push'
        run: |
          echo "=== Multi-arch image inspection ==="
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.rel.outputs.version }}

      # 本地离线镜像：amd64 + arm64，附到 Release
      - name: Build and save amd64 image
        run: |
          docker buildx build --platform linux/amd64 -t ${IMAGE_NAME}:${{ steps.rel.outputs.version }}-amd64 --load .
          docker save ${IMAGE_NAME}:${{ steps.rel.outputs.version }}-amd64 | gzip > smsboard-docker-amd64-${{ steps.rel.outputs.version }}.tar.gz

      - name: Build and save arm64 image
        run: |
          docker buildx build --platform linux/arm64 -t ${IMAGE_NAME}:${{ steps.rel.outputs.version }}-arm64 --load .
          docker save ${IMAGE_NAME}:${{ steps.rel.outputs.version }}-arm64 | gzip > smsboard-docker-arm64-${{ steps.rel.outputs.version }}.tar.gz

      - name: Verify artifacts
        run: ls -lh smsboard-docker-*.tar.gz

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "v${{ steps.rel.outputs.version }}"
          body: |
            ## SmsBoard v${{ steps.rel.outputs.version }}

            ### Docker Hub 镜像

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            docker run -d \
              --name smsboard \
              -p 9990:9990 \
              -v ./data:/app/backend/data \
              -e TZ=Asia/Shanghai \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # 访问 http://<IP>:9990
            ```

            ### 支持架构
            - **AMD64** (x86_64) - 适用于普通 PC、服务器、云主机
            - **ARM64** (aarch64) - 适用于树莓派、ARM 服务器、NAS（含甲骨文 ARM 免费层）

            ### 离线镜像
            - `smsboard-docker-amd64-*.tar.gz` / `smsboard-docker-arm64-*.tar.gz`
            - 导入方式：`docker load -i smsboard-docker-arm64-*.tar.gz`

            ### Cloudflare Worker 部署
            见 README「Cloudflare Pages 部署」章节（免服务器，数据存 R2）。
          draft: false
          prerelease: false
          files: |
            smsboard-docker-amd64-*.tar.gz
            smsboard-docker-arm64-*.tar.gz
